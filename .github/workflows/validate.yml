name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    # Non-blocking while the repo is private: the HACS action fetches
    # hacs.json/manifest.json unauthenticated from raw.githubusercontent.com,
    # which 404s on private repos. Remove this once the repo goes public.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

name: Bug report
description: Something does not work as described. Français accepté.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before opening, please check the [FAQ](https://github.com/Pulpyyyy/cover-extender#faq-and-troubleshooting).
        Vous pouvez écrire en français.
  - type: input
    id: version
    attributes:
      label: Cover Extender version
      description: Settings → Devices & services → Cover Extender.
      placeholder: "3.1.2"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.1"
    validations:
      required: true
  - type: input
    id: cover
    attributes:
      label: Cover integration
      description: The integration that provides the cover (e.g. Shelly, ZHA, ESPSomfy-RTS, Somfy TaHoma).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the mode, whether the cover was locked, and any exclusion entity.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: |
        Enable debug logging on the integration page (or `logger: logs: custom_components.cover_extender: debug`),
        reproduce the problem, then paste the relevant lines.
      render: text
